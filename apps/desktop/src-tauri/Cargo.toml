[package]
name = "parallaxe-desktop"
description = "Parallaxe desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# distinct lib name avoids a bin/lib clash on Windows
name = "parallaxe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
parallaxe-catalog.workspace = true
parallaxe-core = { workspace = true, features = ["ts"] }
parallaxe-indexer.workspace = true
parallaxe-preview.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
tokio = { version = "1", features = ["sync"] }
ts-rs.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
